name: Windows demo validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      MPLCONFIGDIR: ${{ github.workspace }}/.checks/matplotlib
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*lock.txt
      - name: Install validated dependency versions
        run: python -m pip install -r requirements-dev-lock.txt
      - name: Generate independent synthetic inputs
        run: |
          python tools/generate_sample.py
          python tools/generate_flexible_samples.py
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Unit and security regression tests
        run: python -B -m unittest discover -s pharma_agent/tests -p "test_*.py"
      - name: Verify fresh process upload and exports
        run: python -B tools/verify_http.py
      - name: Inspect public tracked files
        run: python -B tools/check_public_files.py

  dependency-audit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit locked runtime, test and optional dependencies
        run: python -m pip_audit --disable-pip --no-deps --strict -r requirements-audit-lock.txt
